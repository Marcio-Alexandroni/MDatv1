spring.application.name=mdatv1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:playyourlist;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
servicos.base-url=http://127.0.0.1:${server.port}
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.jackson.deserialization.accept-float-as-int=false
